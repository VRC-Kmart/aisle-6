name: Auto-merge validated JSON

on:
  workflow_run:
    workflows:
      - Validate JSON and deploy Pages
    types:
      - completed

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge validated Kmart data
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge eligible Kmart JSON pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_TOKEN: ${{ secrets.KMART_ORG_MEMBERSHIP_TOKEN }}
        with:
          retries: 3
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowedDataFiles = new Set([
              "WorldRecentUpdates/ExpressRecentUpdates.json",
              "WorldRecentUpdates/MainStoreRecentUpdates.json",
              "WorldRecentUpdates/SuperKRecentUpdates.json",
              "clockboy/combo-pizza-Dev.json",
              "clockboy/combo-pizza.json",
              "data.json",
              "databases/protv.json",
              "highscores/scoreboard.json",
              "news.json",
            ]);

            let pullRequests = run.pull_requests || [];
            if (pullRequests.length === 0) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pullRequests = associated.data;
            }

            if (pullRequests.length === 0) {
              const openPullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
              pullRequests = openPullRequests.filter(
                (pullRequest) => pullRequest.head.sha === run.head_sha,
              );
            }

            if (pullRequests.length === 0) {
              core.warning(`No pull request found for workflow run ${run.id}.`);
              return;
            }

            const pullNumber = pullRequests[0].number;
            const pullResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const pullRequest = pullResponse.data;

            if (pullRequest.state !== "open" || pullRequest.draft) {
              core.info(`PR #${pullNumber} is not an open, ready pull request.`);
              return;
            }

            if (pullRequest.base.ref !== "main" || pullRequest.head.sha !== run.head_sha) {
              core.info(`Ignoring stale or non-main workflow run ${run.id}.`);
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const validationJob = jobs.find((job) => job.name === "JSON validation");
            if (!validationJob || validationJob.conclusion !== "success") {
              core.warning(`PR #${pullNumber} does not have successful JSON validation.`);
              return;
            }

            let membershipPassed = false;
            for (let attempt = 0; attempt < 24; attempt += 1) {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: run.head_sha,
                per_page: 100,
              });
              const membership = checks.data.check_runs.find(
                (check) => check.name === "Kmart membership",
              );

              if (membership?.conclusion === "success") {
                membershipPassed = true;
                break;
              }
              if (membership?.status === "completed") {
                core.warning(`Kmart membership check concluded ${membership.conclusion}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!membershipPassed) {
              core.setFailed(`Kmart membership check did not pass for PR #${pullNumber}.`);
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const ineligibleFiles = changedFiles.filter(
              (file) => file.status !== "modified" || !allowedDataFiles.has(file.filename),
            );

            if (ineligibleFiles.length) {
              const paths = ineligibleFiles.map((file) => `${file.status}: ${file.filename}`);
              core.notice(
                `PR #${pullNumber} requires manual review: ${paths.join(", ")}`,
              );
              return;
            }

            if (changedFiles.length === 0) {
              core.info(`PR #${pullNumber} has no file changes and is safe to merge.`);
            }

            let currentPullRequest = pullRequest;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const currentResponse = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              currentPullRequest = currentResponse.data;
              if (currentPullRequest.mergeable_state !== "unknown") {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            if (currentPullRequest.head.sha !== run.head_sha) {
              core.info(`PR #${pullNumber} changed while auto-merge was running.`);
              return;
            }

            if (currentPullRequest.mergeable_state === "behind") {
              if (!currentPullRequest.maintainer_can_modify) {
                core.setFailed(
                  `PR #${pullNumber} is behind main and does not allow maintainer updates.`,
                );
                return;
              }

              const updateResponse = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/pulls/${pullNumber}/update-branch`,
                {
                  method: "PUT",
                  headers: {
                    Accept: "application/vnd.github+json",
                    Authorization: `Bearer ${process.env.WORKFLOW_TOKEN}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                  body: JSON.stringify({
                    expected_head_sha: run.head_sha,
                  }),
                },
              );
              if (!updateResponse.ok) {
                const message = await updateResponse.text();
                throw new Error(
                  `Unable to update PR #${pullNumber}: ${updateResponse.status} ${message}`,
                );
              }
              core.info(
                `Updated PR #${pullNumber}; checks will rerun before automatic merge.`,
              );
              return;
            }

            const mergeResponse = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: "merge",
              sha: run.head_sha,
            });

            if (!mergeResponse.data.merged) {
              core.setFailed(
                `GitHub did not merge PR #${pullNumber}: ${mergeResponse.data.message}`,
              );
              return;
            }

            core.info(`Merged PR #${pullNumber} as ${mergeResponse.data.sha}.`);

            // A GITHUB_TOKEN merge does not start a push workflow.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "json-safety.yml",
              ref: pullRequest.base.ref,
            });

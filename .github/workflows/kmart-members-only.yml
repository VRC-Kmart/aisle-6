name: Enforce Kmart membership

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  membership:
    name: Kmart membership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check VRC-Kmart organisation membership
        id: org-membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.KMART_ORG_MEMBERSHIP_TOKEN }}
          script: |
            const username = context.payload.pull_request.user.login;
            try {
              await github.request("GET /orgs/{org}/members/{username}", {
                org: "VRC-Kmart",
                username,
              });
              core.setOutput("is-member", "true");
              core.info(`${username} is a VRC-Kmart organisation member.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.setOutput("is-member", "false");
              core.info(`${username} is not a VRC-Kmart organisation member.`);
            }

      - name: Close non-member pull request
        if: steps.org-membership.outputs.is-member != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- kmart-membership-result -->";
            const pullRequest = context.payload.pull_request;
            const body =
              `${marker}\n## Pull request closed\n\n` +
              `Only members of the VRC-Kmart GitHub organisation may submit changes ` +
              `to this QA repository.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body,
              });
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              state: "closed",
            });

            core.setFailed(
              `${pullRequest.user.login} is not a VRC-Kmart organisation member.`,
            );
